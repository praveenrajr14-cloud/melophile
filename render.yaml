services:
  - type: web
    name: melophile-music-academy
    runtime: static
    buildCommand: npm run build
    staticPublishPath: ./dist
    domains:
      - melophilemusic.com
      - www.melophilemusic.com
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
